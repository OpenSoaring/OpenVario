CONFIG_EXT4_FS=y
# CONFIG_XFS_FS is not set
# CONFIG_BTRFS_FS is not set
# CONFIG_FANOTIFY is not set
CONFIG_AUTOFS_FS=y
# CONFIG_FUSE_FS is not set
# CONFIG_OVERLAY_FS is not set
# CONFIG_FSCACHE is not set
# CONFIG_ISO9660_FS is not set
# CONFIG_UDF_FS is not set
CONFIG_MSDOS_FS=y
CONFIG_VFAT_FS=y

# Larger USB sticks come formatted with exFAT or NTFS, which the
# OpenVario could not mount ("unknown filesystem type 'exfat'").  Both
# drivers are part of the kernel, so no FUSE driver is needed.  exFAT
# uses UTF-8 file names by default, hence NLS_UTF8.
CONFIG_EXFAT_FS=y
CONFIG_NTFS3_FS=y
CONFIG_NTFS3_LZX_XPRESS=y
CONFIG_NLS_UTF8=y
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y

CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y
